name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy HotStack Worker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🔧 Running Wrangler deploy with debug output..."
          npx wrangler deploy 2>&1 | tee deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Deploy failed with exit code $EXIT_CODE"
            echo "📋 Full error log:"
            cat deploy.log
            exit $EXIT_CODE
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          echo "📋 Checking for Wrangler logs..."
          find /home/runner/.config/.wrangler/logs/ -type f -exec cat {} \; 2>/dev/null || echo "No log files found"

      - name: Deployment Success
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Live at: https://hotstack.faa.zone"
