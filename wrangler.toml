name = "hotstack-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

account_id = "ad41fcfe1a84b27c62cc5cc9d590720e"

# R2 Bucket binding
[[r2_buckets]]
binding = "HOTSTACK_BUCKET"
bucket_name = "hotstack-intake-bucket"

# Environment variables
[vars]
# Add AUTH_SECRET as an environment variable for development
# In production, use: wrangler secret put AUTH_SECRET

# D1 Database binding
# IMPORTANT: Replace YOUR_DATABASE_ID with your actual database ID after running:
# wrangler d1 create hotstack-db
[[d1_databases]]
binding = "DB"
database_name = "hotstack-db"
database_id = "YOUR_DATABASE_ID"

# Routes - SEPARATE from r2_buckets!
[[routes]]
pattern = "hotstack.faa.zone/*"
zone_name = "faa.zone"

[[routes]]
pattern = "fruitful.faa.zone/*"
zone_name = "faa.zone"
