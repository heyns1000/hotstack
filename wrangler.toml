name = "hotstack-worker"
main = "src/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Account ID
account_id = "ad41fcfe1a84b27c62cc5cc9d590720e"

# Worker settings
workers_dev = true
route = "hotstack.faa.zone/*"

# R2 Bucket binding
[[r2_buckets]]
binding = "HOTSTACK_BUCKET"
bucket_name = "hotstack-bucket"

# Queue binding (optional - uncomment if using queues)
# [[queues.producers]]
# binding = "HOTSTACK_QUEUE"
# queue = "hotstack-queue"

# Environment variables (optional)
[vars]
# Add any environment variables here

# Production environment
[env.production]
name = "hotstack-worker-production"
route = "hotstack.faa.zone/*"

# Staging environment (optional)
[env.staging]
name = "hotstack-worker-staging"
# route = "staging.hotstack.faa.zone/*"
